<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Ariya Shop | Premium Online Shopping</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Shop premium fashion, electronics, accessories, home essentials, and lifestyle products at Ariya Shop. Enjoy quality products, secure payments, and fast delivery."
    />

    <meta
      name="keywords"
      content="Ariya Shop, online shopping, ecommerce, fashion, electronics, clothing, accessories, home essentials"
    />

    <meta name="author" content="Ariya Shop" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ariya Shop | Premium Online Shopping" />
    <meta
      property="og:description"
      content="Discover quality products at affordable prices with Ariya Shop."
    />
    <meta property="og:site_name" content="Ariya Shop" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ariya Shop | Premium Online Shopping" />
    <meta
      name="twitter:description"
      content="Discover quality products at affordable prices with Ariya Shop."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ariya Shop" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"Store",
      "name":"Ariya Shop",
      "description":"Premium online shopping store offering fashion, electronics, accessories, and lifestyle products."
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
